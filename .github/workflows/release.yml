name: Release

# 构建并发布桌面客户端:
#   - electron-packager: portable zip (4平台，兼容 v1.0.0 用户)
#   - electron-builder:  installer (NSIS exe + DMG，用于自动更新)
#
# 触发方式:
#   1) 推送形如 v0.1.0 的 tag（推荐，配合 docs/发布.sh 使用）
#   2) 手动 workflow_dispatch，填要发布的 tag

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的版本 tag（例如 v0.2.0）"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: win32
            arch: x64
            label: win64
            icon: --icon=src/icon-256.ico
          - os: windows-2022
            platform: win32
            arch: ia32
            label: win32
            icon: --icon=src/icon-256.ico
          - os: macos-latest
            platform: darwin
            arch: arm64
            label: mac-arm
            icon: ""
          - os: macos-latest
            platform: darwin
            arch: x64
            label: mac-intel
            icon: ""
    runs-on: ${{ matrix.os }}
    env:
      VERSION_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        # --ignore-scripts 跳过原生模块的 install 脚本（extract-file-icon 等），
        # 避免在 Windows 上因找不到 Visual Studio 而失败；
        # 原生模块由后续 electron-rebuild 步骤统一编译。
        run: npm ci --ignore-scripts

      - name: Install ui2 dependencies
        # ui2 是独立的子项目（有自己的 package.json），需要单独安装其 devDependencies
        # 否则 vite 找不到，build:ui2 会失败
        run: npm --prefix ui2 ci

      - name: Build settings page (ui2 -> assets)
        run: npm run build:ui2

      - name: Rebuild native modules for Electron (${{ matrix.arch }})
        # -f 强制从源码重新编译，确保 macos.mm 的空指针补丁被编入 .node。
        # electron-builder 内置的 @electron/rebuild 默认 buildFromSource=false，
        # 会沿用 build/Release/ 下缓存二进制；此处先 -f 重建可保证补丁生效。
        env:
          npm_config_arch: ${{ matrix.arch }}
        run: |
          npx electron-rebuild -f -w node-window-manager -a ${{ matrix.arch }}
          npx electron-rebuild -f -w extract-file-icon -a ${{ matrix.arch }}

      # ============ 1. Portable zip (electron-packager，兼容老用户) ============
      - name: Package portable with electron-packager
        shell: bash
        run: |
          VERSION="${VERSION_TAG#v}"
          ICON="${{ matrix.icon }}"
          npx electron-packager . "nas迅雷" \
            --platform=${{ matrix.platform }} \
            --arch=${{ matrix.arch }} \
            --out=dist \
            --prune \
            --asar.unpack=**/*.node \
            --overwrite \
            --ignore=doc --ignore=shell --ignore=ui --ignore=ui2 \
            --ignore=docs --ignore=.git --ignore=.github --ignore=dist \
            --ignore=release --ignore=node_modules/.bin \
            $ICON \
            --app-version="$VERSION"
          echo "--- packaged output ---"
          ls -la dist/

      - name: Create portable zip archive (Windows)
        if: matrix.platform == 'win32'
        shell: pwsh
        run: |
          $VERSION = "${{ env.VERSION_TAG }}" -replace '^v',''
          New-Item -ItemType Directory -Force -Path dist-zip | Out-Null
          $dir = Get-ChildItem -Path dist | Where-Object { $_.Name -match "win32.*${{ matrix.arch }}" } | Select-Object -First 1
          if (-not $dir) { Write-Error "packaged dir not found"; exit 1 }
          Compress-Archive -Path "$($dir.FullName)/*" -DestinationPath "dist-zip/nas-xunlei-${{ matrix.label }}-$VERSION.zip" -Force
          Get-ChildItem dist-zip

      - name: Create portable zip archive (macOS)
        if: matrix.platform == 'darwin'
        shell: bash
        run: |
          VERSION="${VERSION_TAG#v}"
          mkdir -p dist-zip
          DIR=$(ls -d dist/nas* 2>/dev/null | head -1)
          if [ -z "$DIR" ]; then echo "packaged dir not found"; exit 1; fi
          echo "packaged dir: $DIR"
          cd "$DIR" && zip -ry "../../dist-zip/nas-xunlei-${{ matrix.label }}-$VERSION.zip" .
          ls -la ../../dist-zip

      # ============ 2. Installer (electron-builder，用于自动更新) ============
      - name: Build installer with electron-builder (Windows)
        if: matrix.platform == 'win32'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${VERSION_TAG#v}"
          # 修改 package.json 版本号
          npx json -I -f package.json -e "this.version='${VERSION}'"
          if [ "${{ matrix.arch }}" = "ia32" ]; then
            npx electron-builder --win --ia32 --publish never
          else
            npx electron-builder --win --x64 --publish never
          fi
          echo "--- electron-builder output ---"
          ls -la release/

      - name: Build installer with electron-builder (macOS)
        if: matrix.platform == 'darwin'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${VERSION_TAG#v}"
          npx json -I -f package.json -e "this.version='${VERSION}'"
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            npx electron-builder --mac --arm64 --publish never
          else
            npx electron-builder --mac --x64 --publish never
          fi
          echo "--- electron-builder output ---"
          ls -la release/

      - name: Collect installer artifacts
        shell: bash
        run: |
          # dist-zip 已有 electron-packager 免安装版 zip（Create portable zip 步骤生成）
          # 这里只收集 electron-builder 产物（dmg/exe/zip/yml）
          #
          # 关键：每个 job 只收集自己负责的架构，避免 artifact 合并时
          # 同名文件冲突覆盖导致 dmg 损坏。
          PLATFORM="${{ matrix.platform }}"
          ARCH="${{ matrix.arch }}"

          if [ "$PLATFORM" = "darwin" ]; then
            # electron-builder dmg/zip，按架构过滤
            cp release/*-${ARCH}.dmg release/*-${ARCH}.zip dist-zip/ 2>/dev/null || true
            # latest-mac.yml 只在 arm64 job 收集一次
            if [ "$ARCH" = "arm64" ]; then
              cp release/latest-mac.yml dist-zip/ 2>/dev/null || true
            fi
          elif [ "$PLATFORM" = "win32" ]; then
            if [ "$ARCH" = "x64" ]; then
              cp release/*-x64.exe dist-zip/ 2>/dev/null || true
              # 无 arch 后缀的 exe 是 x64+ia32 合并包，只在 x64 job 收集
              cp release/nas-xunlei-Setup-*.exe dist-zip/ 2>/dev/null || true
              rm -f dist-zip/*-ia32.exe 2>/dev/null || true
              # latest.yml 只在 x64 job 收集
              cp release/latest.yml dist-zip/ 2>/dev/null || true
            else
              cp release/*-ia32.exe dist-zip/ 2>/dev/null || true
            fi
          fi
          echo "--- all artifacts ---"
          ls -la dist-zip/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: dist-zip/*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - name: Compute checksums
        run: |
          cd artifacts
          sha256sum *.zip *.exe *.dmg *.yml 2>/dev/null > nas-xunlei-CHECKSUMS.txt || true
          cat nas-xunlei-CHECKSUMS.txt

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ${{ inputs.tag || github.ref_name }}
          body: |
            ## nas-xunlei-client ${{ env.VERSION_TAG }}

            自动构建的桌面客户端。

            ### 安装包（推荐新用户使用，支持自动更新）
            - Windows 64 位安装包 (`nas-xunlei-Setup-${{ env.VERSION_TAG }}-x64.exe`)
            - Windows 32 位安装包 (`nas-xunlei-Setup-${{ env.VERSION_TAG }}-ia32.exe`)
            - macOS Intel (`nas-xunlei-${{ env.VERSION_TAG }}-x64.dmg`)
            - macOS Apple Silicon (`nas-xunlei-${{ env.VERSION_TAG }}-arm64.dmg`)

            ### 免安装版（兼容老用户）
            - Windows 64 位 (`nas-xunlei-win64-*.zip`)
            - Windows 32 位 (`nas-xunlei-win32-*.zip`)
            - macOS Intel (`nas-xunlei-mac-intel-*.zip`)
            - macOS Apple Silicon (`nas-xunlei-mac-arm-*.zip`)

            ### ⚠️ macOS 安装说明（重要！请先阅读再下载）

            由于本应用未经 Apple 开发者签名，下载的 dmg 会被 macOS 标记为"已损坏"，
            **这是正常现象，dmg 本身没有问题**。请按以下步骤操作：

            **方法一：终端命令（推荐，最快捷）**

            1. 下载 dmg 文件
            2. 打开「终端」应用（启动台 → 其他 → 终端）
            3. 粘贴以下命令并回车（把 `下载的文件名` 替换为实际文件名）：

            ```
            xattr -cr ~/Downloads/nas-xunlei-${{ env.VERSION_TAG }}-arm64.dmg
            ```

            > Intel Mac 用户请将 `arm64` 改为 `x64`
            4. 双击打开 dmg，将 nas迅雷 拖到 Applications 文件夹
            5. 在「应用程序」中右键点击 nas迅雷 → 选择「打开」→ 在弹窗中点击「打开」

            **方法二：右键打开 dmg**

            1. 在「访达」的「下载」文件夹中，**右键点击** dmg 文件
            2. 选择「打开」→ 在弹窗中点击「打开」
            3. 打开后将 nas迅雷 拖到 Applications 文件夹
            4. 在「应用程序」中右键点击 nas迅雷 → 选择「打开」→ 在弹窗中点击「打开」

            **dmg 内附带的修复脚本**

            成功打开 dmg 后，里面有一个「修复无法打开.command」文件，
            拖到桌面后右键打开运行，可自动修复应用的隔离属性。

            ### Windows 安装说明
            - **安装包**: 下载 `.exe` 双击安装，后续版本可自动更新
            - **免安装版**: 解压后运行 `nas迅雷.exe`

            ### 校验
            各文件的 SHA-256 见 `nas-xunlei-CHECKSUMS.txt`
          files: |
            artifacts/latest*.yml
            artifacts/nas-xunlei-CHECKSUMS.txt
            artifacts/*.dmg
            artifacts/*.exe
            artifacts/*.zip
          draft: false
          prerelease: false
